<section class="page-section" id="contact">

    <!-- imagen decorativa a la izquierda -->
    <div id="seccion-izq" [style.background-image]="'url(' + fondoSeleccionado + ')'"></div>

    <!-- contenido para el login -->
    <div id="seccion-drch">
        <div id="titulo">
            <div id="contenedor-imagen">
                <h1 class="display-1">Log-in.</h1>
            </div>
            <hr id="separador">
        </div>
        <div id="login">

            <!-- input del correo Electrónico -->
            <div class="group contenedor-input">
                <input #usrName required="" type="text" class="input">
                <span class="highlight"></span>
                <span class="bar"></span>
                <label>nombre de usuario</label>
            </div>

            <!-- sección de la Contraseña -->
            <div class="group contenedor-input">
                <input #usrPswd required="" type="password" class="input">
                <span class="highlight"></span>
                <span class="bar"></span>
                <label>Contraseña</label>
            </div>

            <button class="slice" (click)="iniciarSesion(usrName.value, usrPswd.value)">
                <span class="text">Iniciar Sesión</span>
            </button>
        </div>
    </div>

    <!-- se mostrará en caso de que el login sea incorrecto. -->
    @if (this.errorLogin == true ) {
        <div class="position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1050" id="error-login">
            <div class="alert alert-danger border-0 border-bottom border-danger border-4 shadow-lg mb-4" role="alert">
                <div class="d-flex align-items-center">
                    <i class="bi bi-exclamation-octagon-fill me-2 fs-5"></i>
                    <span><strong>Error:</strong> Usuario o contraseña incorrectos.</span>
                    <button type="button" class="btn-close ms-3" (click)="errorLogin = false"></button>
                </div>
            </div>
        </div>
    }    
</section>
